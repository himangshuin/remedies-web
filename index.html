 $$('nav.top [data-v]').forEach(b=>{const v=b.dataset.v;b.innerHTML=v==='saved'?t('saved')+' <span id="sc"></span>':t(v)});
 const ic={find:'🔎',read:'📖',saved:'⭐'};$$('.bn [data-v]').forEach(b=>b.innerHTML='<span>'+ic[b.dataset.v]+'</span>'+t(b.dataset.v));
 $('#q').placeholder=t('ph');$('#ft').innerHTML=t('foot')+'<br>Version 9';$('#lang').value=lang;setSaved(saved());
 const g=$('#gtb');if(lang==='en'){g.hidden=true}else{g.hidden=false;const on=localStorage.getItem('gt')===lang;g.innerHTML=t('gtq')+(on?`<button id="gtoff">${t('gto')}</button>`:`<button id="gton">${t('gtb')}</button>`)}}
function gtOn(l){const go=()=>{const s=document.querySelector('select.goog-te-combo');if(!s)return setTimeout(go,300);s.value=l;s.dispatchEvent(new Event('change'))};
 if(window.google&&google.translate&&google.translate.TranslateElement)go();else{window.gtInit=()=>{new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'hi,as',autoDisplay:false},'gt');go()};const sc=document.createElement('script');sc.src='https://translate.google.com/translate_a/element.js?cb=gtInit';document.head.append(sc)}}
function gtOff(){try{localStorage.removeItem('gt')}catch(e){}document.cookie='googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';document.cookie='googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain='+location.hostname;location.reload()}
document.addEventListener('click',e=>{if(e.target.id==='gton'){try{localStorage.setItem('gt',lang)}catch(x){}applyLang();gtOn(lang)}else if(e.target.id==='gtoff')gtOff()});
$('#lang').addEventListener('change',e=>{const had=localStorage.getItem('gt');lang=e.target.value;try{localStorage.setItem('lang',lang)}catch(x){}if(had&&(lang==='en'||had!==lang)){if(lang==='en'){gtOff();return}try{localStorage.setItem('gt',lang)}catch(x){}}applyLang();render();if(localStorage.getItem('gt')===lang)gtOn(lang)});
applyLang();parseHash();render();if(lang!=='en'&&localStorage.getItem('gt')===lang)gtOn(lang);
